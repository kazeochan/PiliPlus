# Unsigned iOS .ipa for sideloading (IPASideloader / AltStore / SideStore re-sign it).
#
# Mirrors upstream PiliPlus 2.2.1 `.github/workflows/ios.yml` toolchain exactly:
#   runner macos-26, Flutter from pubspec.yaml (3.47.9 stable), upstream build.ps1 + patch.ps1 iOS
#   (Flutter SDK / material_ui / cupertino_ui patches + `flutter pub get`),
#   `flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub`.
# Adds: Payload packaging, IPA content + Mach-O + libmpv/FFmpeg (AV1/VideoToolbox) checks, SHA-256, artifact upload.
#
# Runs when app files are pushed to the fix branch, on manual dispatch, and when sync-upstream.yml
# has merged a new upstream release (workflow_call: a push made with GITHUB_TOKEN starts no workflow).
# Pushes that only touch .github/ or Markdown do not start a build; dispatch one by hand if needed.
#
# A strict build that passes every check is published as a GitHub release (push builds and sync builds
# always, manual runs when asked). Each built commit gets its own tag,
# `<app version>-pip.<build number>-<commit>`, with the IPA as the only asset, so a sideloader that
# follows this repository's latest release installs it. A published release is never replaced.
#
# Four jobs, so that nothing the build job says about its own output is taken on trust:
#   resolve  works out the commit, version, tag and IPA file name once, without running project code
#   build    runs upstream code with a read-only token and uploads the IPA
#   verify   checks that exact IPA on a fresh runner that has run none of that code
#   publish  the only job that may write; publishes the IPA whose digest the verify job reported

name: Build iOS unsigned IPA (sideload)

on:
  workflow_dispatch:
    inputs:
      strict_av1_check:
        description: "Fail if av1_videotoolbox / libdav1d / Avcodec ABI checks fail (push builds are always strict)"
        required: false
        default: true
        type: boolean
      publish_release:
        description: "Publish the IPA as a GitHub release (strict builds only)"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: "Commit to build (default: the commit the calling workflow runs on)"
        required: false
        default: ""
        type: string
      strict_av1_check:
        description: "Fail if av1_videotoolbox / libdav1d / Avcodec ABI checks fail"
        required: false
        default: true
        type: boolean
      publish_release:
        description: "Publish the IPA as a GitHub release (strict builds only)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - fix/ios-pip-hwdec-av1
    paths-ignore:
      - "**.md"
      - ".github/**"

permissions:
  contents: read

# publishing and artifact-only runs do not cancel each other
concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}-${{ (github.event_name == 'push' || (inputs.publish_release && inputs.strict_av1_check)) && 'publish' || 'artifact' }}
  cancel-in-progress: true

env:
  IPA_SUFFIX: ios-pip-hwdec-av1-unsigned
  # media_kit_libs_ios_video pin from pubspec.yaml (ShionjiART/media-kit, libmpv v0.39.0-av1.1, FFmpeg 8.0.3)
  LIBMPV_PKG_REF: a947586e84a6d29acaa5eb1ca13e16eba923c98b
  LIBMPV_XCFRAMEWORKS_VERSION: v0.39.0-av1.1
  EXPECTED_AVCODEC_MAJOR: "62"

jobs:
  resolve:
    name: Resolve commit, version and names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      app_version: ${{ steps.meta.outputs.app_version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      tag: ${{ steps.meta.outputs.tag }}
      ipa: ${{ steps.meta.outputs.ipa }}
    steps:
      # read only: nothing from the checkout is executed. `ref` is resolved here once, so every
      # later job works on the same commit even if a branch moves meanwhile.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # empty outside workflow_call: the commit that triggered the run
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Work out version, tag and file name
        id: meta
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          # same rule as lib/scripts/build.ps1: version name from pubspec.yaml, build number = commit count
          app_version="$(sed -n -E 's/^[[:space:]]*version:[[:space:]]*([0-9]+(\.[0-9]+){1,3}).*/\1/p' pubspec.yaml | head -n 1)"
          [ -n "$app_version" ] || { echo "::error::no version in pubspec.yaml"; exit 1; }
          build_number="$(git rev-list --count HEAD)"
          {
            echo "sha=${sha}"
            echo "app_version=${app_version}"
            echo "build_number=${build_number}"
            echo "tag=${app_version}-pip.${build_number}-${sha:0:9}"
            echo "ipa=PiliPlus-${app_version}-b${build_number}-${IPA_SUFFIX}.ipa"
          } | tee -a "$GITHUB_OUTPUT"

  build-ios-unsigned-ipa:
    name: Build unsigned iOS IPA
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          # build.ps1 uses `git rev-list --count HEAD` as the build number
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          # no cache: patch.ps1 patches $FLUTTER_ROOT in place, a cached patched SDK would make `git apply` fail

      - name: Toolchain versions
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          flutter --version
          dart --version
          pod --version
          pwsh --version
          echo "Podfile.lock CocoaPods: $(grep '^COCOAPODS:' ios/Podfile.lock)"

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      # patch.ps1 runs `flutter pub get` but never checks its exit code (only `git apply` is checked),
      # and the build below uses --no-pub, so assert the resolution here instead of failing later.
      - name: Verify pub resolution
        run: |
          set -euo pipefail
          test -s .dart_tool/package_config.json || { echo "::error::flutter pub get (in patch.ps1) did not produce .dart_tool/package_config.json"; exit 1; }
          grep -q "media-kit-${LIBMPV_PKG_REF}" .dart_tool/package_config.json \
            || { echo "::error::media_kit_libs_ios_video is not resolved to ${LIBMPV_PKG_REF}"; grep -n media_kit_libs_ios_video .dart_tool/package_config.json || true; exit 1; }
          grep -A6 '^  media_kit_libs_ios_video:' pubspec.lock | tee "$RUNNER_TEMP/lock-entry.txt"
          if ! grep -q "resolved-ref: ${LIBMPV_PKG_REF}" "$RUNNER_TEMP/lock-entry.txt" \
            || ! grep -q 'ShionjiART/media-kit.git' "$RUNNER_TEMP/lock-entry.txt"; then
            echo "::error::pubspec.lock entry for media_kit_libs_ios_video changed during pub get"; exit 1
          fi
          echo "pubspec.lock changes from pub get (geetest_ios.patch adds gt3_flutter_plugin on iOS):"
          git --no-pager diff --stat -- pubspec.lock

      - name: Build iOS (no codesign)
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
          test -d build/ios/iphoneos/Runner.app
          # the podspec runs `system("make")` and ignores its result, so a failed libmpv download or sha256
          # mismatch would otherwise only show up as missing frameworks in the app
          mk_ios=ios/.symlinks/plugins/media_kit_libs_ios_video/ios
          grep -q "^MPV_XCFRAMEWORKS_VERSION=${LIBMPV_XCFRAMEWORKS_VERSION}$" "$mk_ios/Makefile" \
            || { echo "::error::media_kit_libs_ios_video Makefile is not libmpv ${LIBMPV_XCFRAMEWORKS_VERSION}"; exit 1; }
          for xc in Mpv Avcodec Avformat Avutil Dav1d; do
            test -d "$mk_ios/Frameworks/$xc.xcframework" || { echo "::error::libmpv download/extract failed: $xc.xcframework missing"; exit 1; }
          done
          if ! git diff --quiet -- ios/Podfile.lock; then
            echo "::warning title=Podfile.lock drift::pod install changed ios/Podfile.lock"
            git --no-pager diff --stat -- ios/Podfile.lock
          fi

      - name: Package unsigned IPA
        id: package
        env:
          EXPECTED_IPA: ${{ needs.resolve.outputs.ipa }}
        run: |
          set -euo pipefail
          # exported to $GITHUB_ENV by lib/scripts/build.ps1 ("<name>+<commit count>")
          # shellcheck disable=SC2154
          : "${version:?version not exported by lib/scripts/build.ps1}"
          safe_version="${version//+/-b}"
          ipa="PiliPlus-${safe_version}-${IPA_SUFFIX}.ipa"
          # the later jobs look for the name the resolve job worked out
          [ "$ipa" = "$EXPECTED_IPA" ] || { echo "::error::build.ps1 version gives ${ipa}, the resolve job expected ${EXPECTED_IPA}"; exit 1; }
          rm -rf Payload "$ipa"
          mkdir Payload
          ditto build/ios/iphoneos/Runner.app Payload/Runner.app
          # same as upstream ios.yml: ad-hoc sign embedded frameworks so AltSign-based sideloaders accept them.
          # A loop instead of `find -exec ... \;`, whose exit status ignores codesign failures;
          # -depth signs nested bundles before the bundle containing them.
          signed=0
          while IFS= read -r -d '' fw; do
            codesign --force --sign - --preserve-metadata=identifier,entitlements "$fw" \
              || { echo "::error::codesign failed: ${fw#Payload/}"; exit 1; }
            signed=$((signed + 1))
          done < <(find Payload/Runner.app/Frameworks -depth -type d -name '*.framework' -print0)
          [ "$signed" -gt 0 ] || { echo "::error::no frameworks found to sign"; exit 1; }
          while IFS= read -r -d '' fw; do
            codesign --verify --strict --verbose=1 "$fw" \
              || { echo "::error::signature does not verify: ${fw#Payload/}"; exit 1; }
          done < <(find Payload/Runner.app/Frameworks -depth -type d -name '*.framework' -print0)
          echo "signed and verified $signed framework(s)"
          zip -qr9y "$ipa" Payload
          shasum -a 256 "$ipa"
          ls -lh "$ipa"
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: PiliPlus-ios-unsigned-ipa
          path: ${{ steps.package.outputs.ipa }}
          if-no-files-found: error
          retention-days: 14

  verify-ipa:
    name: Verify IPA on a clean runner
    needs: [resolve, build-ios-unsigned-ipa]
    runs-on: macos-26
    timeout-minutes: 15
    # no repository access: this job only reads the IPA (it is unpacked and inspected, never run)
    permissions: {}
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - name: Download unsigned IPA
        uses: actions/download-artifact@v8
        with:
          # uploaded with `archive: false`: the artifact is the file itself, named after it
          name: ${{ needs.resolve.outputs.ipa }}

      - name: Verify IPA contents and Mach-O / FFmpeg
        id: verify
        env:
          IPA: ${{ needs.resolve.outputs.ipa }}
          # push builds have no inputs: always strict
          STRICT_AV1: ${{ github.event_name == 'push' || inputs.strict_av1_check }}
        run: |
          set -euo pipefail
          test -s "$IPA" || { echo "::error::IPA artifact ${IPA} is missing"; exit 1; }
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          check_dir="$RUNNER_TEMP/ipa-check"
          rm -rf "$check_dir" && mkdir -p "$check_dir"
          unzip -q "$IPA" -d "$check_dir"
          app="$check_dir/Payload/Runner.app"
          report="$RUNNER_TEMP/ipa-verify.txt"
          : > "$report"
          fail=0

          {
            echo "== IPA: $IPA"
            echo "== Top-level entries"; unzip -Z1 "$IPA" | awk -F/ '{print $1}' | sort -u
            echo "== Info.plist"
            for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion CFBundleExecutable MinimumOSVersion; do
              printf '%s = %s\n' "$key" "$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist" 2>/dev/null || echo MISSING)"
            done
            echo "UIBackgroundModes: $(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$app/Info.plist" 2>/dev/null | tr -s ' \n' ' ' || echo MISSING)"
            echo "== Main executable"
            lipo -archs "$app/Runner"
            echo "== Embedded frameworks"
            ls -1 "$app/Frameworks"
          } | tee -a "$report"

          [ "$(unzip -Z1 "$IPA" | awk -F/ '{print $1}' | sort -u)" = "Payload" ] || { echo "::error::IPA root must contain only Payload/"; fail=1; }

          required="App Flutter Mpv Avcodec Avformat Avutil Avfilter Swscale Swresample Dav1d Placebo media_kit_libs_ios_video media_kit_video media_kit_native_event_loop"
          for fw in $required; do
            bin="$app/Frameworks/$fw.framework/$fw"
            if [ ! -f "$bin" ]; then
              echo "::error::missing $fw.framework"; fail=1; continue
            fi
            echo "$fw: $(lipo -archs "$bin") $(file -b "$bin" | cut -c1-60)" | tee -a "$report"
          done

          # strict: AV1 / ABI problems fail the job; otherwise they are warnings
          gate() {
            if [ "$STRICT_AV1" = "true" ]; then echo "::error::$1"; fail=1; else echo "::warning::$1 (non-strict run)"; fi
          }
          # problems that make the IPA unusable whatever the mode
          bad() { echo "BAD: $1" | tee -a "$report"; echo "::error::$1"; fail=1; }
          # load commands of the arm64 slice, one per line:
          #   PLATFORM <LC_BUILD_VERSION platform, 2 = iOS device>
          #   ID <install name> <compatibility major>
          #   DEP <load command> <install name> <compatibility major>
          macho_info() {
            otool -arch arm64 -l "$1" | awk '
              $1 == "cmd" { cmd = $2; name = ""; if (cmd == "LC_VERSION_MIN_IPHONEOS") print "PLATFORM 2" }
              $1 == "platform" && cmd == "LC_BUILD_VERSION" { print "PLATFORM", $2 }
              $1 == "name" && cmd ~ /^LC_(ID|LOAD|LOAD_WEAK|REEXPORT|LAZY_LOAD|LOAD_UPWARD)_DYLIB$/ { name = $2 }
              $1 == "compatibility" && $2 == "version" && name != "" {
                v = $3; sub(/\..*/, "", v)
                kind = (cmd == "LC_ID_DYLIB") ? "ID" : "DEP " cmd
                print kind, name, v
                name = ""
              }'
          }
          # compatibility major of a dylib's own LC_ID_DYLIB
          id_major() { { macho_info "$1" || true; } | awk '$1 == "ID" { print $3 }'; }

          avcodec="$app/Frameworks/Avcodec.framework/Avcodec"
          mpv="$app/Frameworks/Mpv.framework/Mpv"
          if [ -f "$avcodec" ] && [ -f "$mpv" ]; then
            # dump once to a file: early-exit readers (grep -q / -m1) on a pipe trip SIGPIPE under pipefail
            strings -a "$avcodec" > "$RUNNER_TEMP/avcodec.strings"
            otool -L "$avcodec" > "$RUNNER_TEMP/avcodec.otool"
            otool -L "$mpv" > "$RUNNER_TEMP/mpv.otool"
            {
              echo "== FFmpeg / libmpv ABI"
              echo "Avcodec dylib version: $(awk 'NR==2{print $NF}' "$RUNNER_TEMP/avcodec.otool" | tr -d ')')"
              echo "FFmpeg hwaccels compiled in: $(grep -E '^[a-z0-9]+_videotoolbox$' "$RUNNER_TEMP/avcodec.strings" | sort -u | tr '\n' ' ')"
              echo "Avcodec install name / deps:"; sed 1d "$RUNNER_TEMP/avcodec.otool"
              echo "Mpv deps:"; sed 1d "$RUNNER_TEMP/mpv.otool"
            } | tee -a "$report"

            avcodec_major="$(id_major "$avcodec")"
            if [ "$avcodec_major" = "$EXPECTED_AVCODEC_MAJOR" ]; then
              echo "ok: Avcodec major $avcodec_major" | tee -a "$report"
            else
              echo "BAD: Avcodec major ${avcodec_major:-?} (expected $EXPECTED_AVCODEC_MAJOR)" | tee -a "$report"
              gate "Avcodec ABI ${avcodec_major:-?} != expected $EXPECTED_AVCODEC_MAJOR"
            fi

            echo "== AV1 markers in Avcodec" | tee -a "$report"
            for marker in av1_videotoolbox libdav1d; do
              if grep -qx "$marker" "$RUNNER_TEMP/avcodec.strings"; then
                echo "found: $marker" | tee -a "$report"
              else
                echo "MISSING: $marker" | tee -a "$report"; gate "$marker missing in Avcodec"
              fi
            done
            if grep -q '/VideoToolbox.framework/' "$RUNNER_TEMP/avcodec.otool"; then
              echo "Avcodec links VideoToolbox" | tee -a "$report"
            else
              echo "Avcodec does NOT link VideoToolbox" | tee -a "$report"; gate "Avcodec does not link VideoToolbox"
            fi
          fi

          # Dependency closure from Runner over every embedded framework: each binary needs an arm64
          # slice for iOS devices, a valid signature (frameworks), and every @rpath framework it links
          # must be embedded with the compatibility major it was linked against (ABI: gated).
          echo "== Dependency closure (arm64, iOS device)" | tee -a "$report"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist" 2>/dev/null || echo Runner)"
          queue=("$app/$exe")
          for fw_path in "$app"/Frameworks/*.framework; do
            [ -d "$fw_path" ] || continue
            name="$(basename "$fw_path" .framework)"
            [ -f "$fw_path/$name" ] || { bad "$name.framework has no binary"; continue; }
            codesign --verify --strict "$fw_path" 2>/dev/null || bad "$name.framework: signature does not verify"
            queue+=("$fw_path/$name")
          done
          seen=$'\n'
          i=0
          while [ "$i" -lt "${#queue[@]}" ]; do
            bin="${queue[$i]}"
            i=$((i + 1))
            case "$seen" in *$'\n'"$bin"$'\n'*) continue ;; esac
            seen="$seen$bin"$'\n'
            label="$(basename "$bin")"
            archs="$(lipo -archs "$bin" 2>/dev/null || true)"
            case " $archs " in
              *" arm64 "*) ;;
              *) bad "$label: no arm64 slice (archs: ${archs:-not Mach-O})"; continue ;;
            esac
            [ "$archs" = "arm64" ] || echo "::warning::$label has extra slices: $archs"
            macho_info "$bin" > "$RUNNER_TEMP/macho.txt" || { bad "$label: otool failed"; continue; }
            platforms="$(awk '$1 == "PLATFORM" { print $2 }' "$RUNNER_TEMP/macho.txt" | sort -u | paste -sd, -)"
            [ "$platforms" = "2" ] || bad "$label: arm64 slice is not built for iOS devices (platform ${platforms:-unknown}; 2 = iOS, 7 = simulator)"
            while read -r kind cmd dep_name want; do
              [ "$kind" = "DEP" ] || continue
              case "$dep_name" in @rpath/*.framework/*) ;; *) continue ;; esac
              dep="${dep_name#@rpath/}"
              dep_bin="$app/Frameworks/$dep"
              dep_label="${dep%%.framework/*}"
              if [ ! -f "$dep_bin" ]; then
                if [ "$cmd" = "LC_LOAD_WEAK_DYLIB" ]; then
                  echo "note: $label -> $dep_label (weak, not embedded)" | tee -a "$report"
                else
                  bad "$label -> $dep_label: not embedded in Frameworks/"
                fi
                continue
              fi
              have="$(id_major "$dep_bin")"
              if [ "$have" = "$want" ]; then
                echo "ok: $label -> $dep_label major $want" >> "$report"
              else
                echo "BAD: $label -> $dep_label linked against major $want, embedded major ${have:-?}" | tee -a "$report"
                gate "ABI mismatch: $label -> $dep_label ($want vs ${have:-?})"
              fi
              queue+=("$dep_bin")
            done < "$RUNNER_TEMP/macho.txt"
          done
          checked=$(printf '%s' "$seen" | grep -c . || true)
          echo "checked $checked binaries" | tee -a "$report"

          {
            echo '### Unsigned IPA'
            echo '```'
            cat "$report"
            cat "$IPA.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$report" "${IPA%.ipa}.verify.txt"
          [ "$fail" -eq 0 ] || exit "$fail"
          # only an IPA that passed is handed to the publish job, by digest
          echo "digest=$(cut -d' ' -f1 "$IPA.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-ios-unsigned-ipa-report
          path: |
            PiliPlus-*-unsigned.ipa.sha256
            PiliPlus-*-unsigned.verify.txt
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    needs: [resolve, verify-ipa]
    # push builds are always strict; other runs publish only when asked and strict
    # (a workflow that calls this one from its own push trigger publishes too)
    if: github.event_name == 'push' || (inputs.publish_release && inputs.strict_av1_check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download unsigned IPA
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.resolve.outputs.ipa }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          APP_VERSION: ${{ needs.resolve.outputs.app_version }}
          BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          TAG: ${{ needs.resolve.outputs.tag }}
          IPA: ${{ needs.resolve.outputs.ipa }}
          VERIFIED_DIGEST: ${{ needs.verify-ipa.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test -s "$IPA" || { echo "::error::IPA artifact ${IPA} is missing"; exit 1; }
          digest="$(sha256sum "$IPA" | cut -d' ' -f1)"
          [[ "$VERIFIED_DIGEST" =~ ^[0-9a-f]{64}$ ]] && [ "$digest" = "$VERIFIED_DIGEST" ] \
            || { echo "::error::this IPA is not the one the verify job checked"; exit 1; }

          # State of the release for $TAG, drafts included; empty if there is none, an error if
          # several releases claim the tag (drafts can):
          #   "<draft> <prerelease> <target> <id of the uploaded asset named $IPA, or -> <number of .ipa assets>"
          # A sideloader takes the first .ipa of the latest full release, so only a release that is
          # neither draft nor pre-release and holds exactly this one .ipa counts as published.
          release_state() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              | jq -rs --arg tag "$TAG" --arg ipa "$IPA" 'add | map(select(.tag_name == $tag))
                  | if length > 1 then error("more than one release uses tag " + $tag) else .[0] end | select(. != null)
                  | "\(.draft) \(.prerelease) \(.target_commitish) \([.assets[] | select(.name == $ipa and .state == "uploaded") | .id][0] // "-") \([.assets[] | select(.name | ascii_downcase | endswith(".ipa"))] | length)"'
          }
          # SHA-256 of the bytes a release asset really holds: downloaded and hashed, not read from
          # metadata. Fails, printing nothing, when the download fails.
          asset_digest() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/$1" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/release-asset.ipa" || return 1
            sha256sum "$RUNNER_TEMP/release-asset.ipa" | cut -d' ' -f1
          }
          # commit the tag points to; empty only when GitHub confirms there is no such tag
          tag_commit() {
            local out
            if out="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>"$RUNNER_TEMP/tag.err")"; then
              printf '%s\n' "$out"
            elif grep -q 'HTTP 404' "$RUNNER_TEMP/tag.err"; then
              return 0
            else
              cat "$RUNNER_TEMP/tag.err" >&2; return 1
            fi
          }

          # the tag names the commit, so it may only already exist on this commit
          tag_sha="$(tag_commit)" || { echo "::error::could not look up tag ${TAG}"; exit 1; }
          [ -z "$tag_sha" ] || [ "$tag_sha" = "$SHA" ] || { echo "::error::tag ${TAG} already exists and does not point to ${SHA}"; exit 1; }
          state="$(release_state)"
          published_digest="$digest"
          if [ -z "$state" ]; then
            {
              echo "Unsigned iOS build of PiliPlus ${APP_VERSION} (build ${BUILD_NUMBER}) with this fork's Picture in Picture and AV1 hardware decoding fixes. Re-sign it with a sideloader before installing."
              echo
              echo "- Commit: ${SHA}"
              echo "- SHA-256: \`${digest}\`"
              echo "- Build and checks: ${RUN_URL}"
            } > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" "$IPA" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "PiliPlus ${APP_VERSION} (${BUILD_NUMBER}) iOS unsigned" --notes-file "$RUNNER_TEMP/notes.md" --latest
          else
            # an earlier attempt got this far: finish it, but never replace an IPA that is already there
            read -r draft prerelease target asset_id ipa_count <<< "$state"
            [ "$target" = "$SHA" ] || [ "$tag_sha" = "$SHA" ] || { echo "::error::release ${TAG} exists for another commit"; exit 1; }
            stable=false
            if [ "$draft" = "false" ] && [ "$prerelease" = "false" ]; then stable=true; fi
            if [ "$asset_id" = "-" ]; then
              [ "$ipa_count" -eq 0 ] || { echo "::error::release ${TAG} holds an .ipa that is not a complete ${IPA}; remove it or the release and run again"; exit 1; }
              gh release upload "$TAG" "$IPA" --repo "$GITHUB_REPOSITORY"
            else
              [ "$ipa_count" -eq 1 ] || { echo "::error::release ${TAG} holds more than one .ipa; remove the extra one and run again"; exit 1; }
              existing="$(asset_digest "$asset_id")" || { echo "::error::could not read the IPA that release ${TAG} holds"; exit 1; }
              if [ "$existing" = "$digest" ]; then
                echo "release ${TAG} already holds this IPA"
              elif [ "$stable" = "true" ]; then
                # the same commit was built again: the bytes differ, the published release stays
                echo "::notice title=Release kept::${TAG} is already published with another build of this commit; it was left as it is"
                published_digest="$existing"
              else
                # a draft or pre-release with other bytes is not something to promote
                echo "::error::unpublished release ${TAG} holds a different IPA (${existing}) than the verified one; delete it and run again"; exit 1
              fi
            fi
            [ "$stable" = "true" ] || gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi

          # done only when it is really out: a full release on this commit whose only .ipa is the expected bytes
          for attempt in 1 2 3; do
            tag_sha="$(tag_commit)" || tag_sha=""
            state="$(release_state)" || state=""
            read -r draft prerelease target asset_id ipa_count <<< "${state:-? ? ? - 0}"
            have=""
            if [ "$asset_id" != "-" ]; then have="$(asset_digest "$asset_id")" || have=""; fi
            if [ "$tag_sha" = "$SHA" ] && [ "$draft" = "false" ] && [ "$prerelease" = "false" ] && [ "$ipa_count" = "1" ] \
              && [ -n "$have" ] && [ "$have" = "$published_digest" ]; then
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::release ${TAG} is not fully published (tag ${tag_sha:-missing}, state: ${state:-missing}, asset digest ${have:-unread})"; exit 1; }
            sleep 5
          done
          echo "- Release \`${TAG}\` is published (SHA-256 \`${published_digest}\`)" >> "$GITHUB_STEP_SUMMARY"
